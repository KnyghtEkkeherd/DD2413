# Wizard configuration. Reloaded at each START, so you can tune between runs
# without restarting ROS.

# FAILURE button: one press runs these steps in order. Steps:
#   say: <speech_bank category>        speak a random variant, wait until done
#   play: <file.wav> | sound_group: <group in sounds.yaml>   play, then wait `wait` s
#   pause: <seconds>
# STOP or Stop talking cancels the sequence.
failure_sequence:
  - say: LOST
  - pause: 0.5
  - sound_group: Sad
    wait: 3.0
  - say: ASK_HELP

speech:                     # used to wait for speech to finish if Misty's
  fallback_s_per_word: 0.4  # TextToSpeechComplete event isn't available
  fallback_extra_s: 1.0
  completion_margin_s: 5    # max extra wait beyond the estimate

look_back:
  head_yaw_deg: 81          # Misty's max yaw (+ = left)
  head_velocity: 70         # % of max head speed
  return_after_s: 4         # head turns back to centre after this long

nudge:                      # small drift corrections
  turn_velocity: 30         # % angular speed
  turn_ms: 500
  forward_velocity: 25      # % linear speed
  forward_ms: 700

# Route: fixed motion segments, one per "Next segment" press (no SLAM).
#   forward: {velocity: % of max speed (negative = back), time_ms}
#   turn:    {degrees: + left / - right, velocity: % angular speed, time_ms}
# PLACEHOLDER VALUES: tune on the taped floor.
route:
  - {forward: {velocity: 30, time_ms: 4000}}
  - {turn: {degrees: -90, velocity: 30, time_ms: 3000}}
  - {forward: {velocity: 30, time_ms: 4000}}
  - {forward: {velocity: 30, time_ms: 4000}}
  - {turn: {degrees: 90, velocity: 30, time_ms: 3000}}
  - {forward: {velocity: 30, time_ms: 3000}}
